<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Smart Parking</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #1e3a5f;
            color: white;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {
            background: white;
            width: 450px;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .register-box h1 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2e86de;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2e86de;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e6fbd;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
        }

        .login-link a {
            color: #2e86de;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        🚗 Smart Parking
    </div>

    <a href="index.html">Home</a>

</header>


<div class="container">

    <div class="register-box">

        <h1>Create Account</h1>

        <form id="registerForm">

            <div class="form-group">

                <label for="name">Full Name</label>

                <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                >

            </div>


            <div class="form-group">

                <label for="email">Email</label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                >

            </div>


            <div class="form-group">

                <label for="phone">Phone Number</label>

                <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        pattern="[0-9]{10}"
                        required
                >

            </div>


            <div class="form-group">

                <label for="password">Password</label>

                <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">Confirm Password</label>

                <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                >

            </div>


            <button type="submit" id="registerButton">
                Create Account
            </button>

            <div class="message" id="registerMessage"></div>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<script>

    document.getElementById("registerForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("registerMessage");


        if (password !== confirmPassword) {

            message.style.color = "red";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        message.style.color = "green";

        message.textContent =
            "Registration successful!";


        setTimeout(function() {

            window.location.href = "login.html";

        }, 1000);

    });

</script>

</body>

</html>
