<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bookings - Smart Parking</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #1e3a5f;
            color: white;
            padding: 20px 60px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 30px;
        }

        .booking-card {
            background: white;
            border-radius: 12px;
            padding: 30px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.1);

            margin-bottom: 25px;
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #ddd;

            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .booking-header h2 {
            color: #1e3a5f;
        }

        .status {
            background: #2ecc71;
            color: white;

            padding: 7px 15px;

            border-radius: 20px;

            font-size: 14px;
            font-weight: bold;
        }

        .details {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 18px;
        }

        .detail {
            background: #f7f9fc;

            padding: 15px;

            border-radius: 6px;
        }

        .detail strong {
            display: block;

            color: #555;

            margin-bottom: 5px;
        }

        .detail span {
            color: #1e3a5f;
            font-weight: bold;
        }

        .fee {
            margin-top: 20px;

            text-align: right;

            font-size: 22px;
            font-weight: bold;

            color: #27ae60;
        }

        .cancel-button {
            display: block;

            margin: 25px auto 0;

            padding: 12px 25px;

            background: #e74c3c;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .cancel-button:hover {
            background: #c0392b;
        }

        .no-booking {
            background: white;

            padding: 50px;

            text-align: center;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .no-booking h2 {
            color: #1e3a5f;
            margin-bottom: 15px;
        }

        .book-button {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 25px;

            background: #2e86de;

            color: white;

            text-decoration: none;

            border-radius: 6px;

            font-weight: bold;
        }

        @media (max-width: 700px) {

            .details {
                grid-template-columns: 1fr;
            }

            header {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        🚗 Smart Parking
    </div>

    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="parking.html">
            Parking
        </a>

        <a href="index.html">
            Logout
        </a>

    </nav>

</header>


<div class="container">

    <h1>
        My Parking Bookings
    </h1>


    <div id="bookingContainer"></div>

</div>


<script>


    function displayBooking() {

        const bookingData =
            localStorage.getItem("booking");


        const container =
            document.getElementById("bookingContainer");


        if (!bookingData) {

            container.innerHTML = `

                <div class="no-booking">

                    <h2>
                        No Bookings Found
                    </h2>

                    <p>
                        You currently have no parking bookings.
                    </p>

                    <a
                        href="parking.html"
                        class="book-button"
                    >
                        Book Parking
                    </a>

                </div>

            `;

            return;

        }


        const booking =
            JSON.parse(bookingData);


        container.innerHTML = `

            <div class="booking-card">

                <div class="booking-header">

                    <h2>
                        Parking Booking
                    </h2>

                    <span
                        class="status"
                        id="bookingStatus"
                    >
                        CONFIRMED
                    </span>

                </div>


                <div class="details">

                    <div class="detail">

                        <strong>
                            Parking Slot
                        </strong>

                        <span id="historySlot">
                            ${booking.slot}
                        </span>

                    </div>


                    <div class="detail">

                        <strong>
                            Vehicle Number
                        </strong>

                        <span id="historyVehicle">
                            ${booking.vehicleNumber}
                        </span>

                    </div>


                    <div class="detail">

                        <strong>
                            Vehicle Type
                        </strong>

                        <span>
                            ${booking.vehicleType}
                        </span>

                    </div>


                    <div class="detail">

                        <strong>
                            Parking Date
                        </strong>

                        <span>
                            ${booking.date}
                        </span>

                    </div>


                    <div class="detail">

                        <strong>
                            Parking Time
                        </strong>

                        <span>
                            ${booking.time}
                        </span>

                    </div>


                    <div class="detail">

                        <strong>
                            Duration
                        </strong>

                        <span>
                            ${booking.duration} Hour(s)
                        </span>

                    </div>

                </div>


                <div class="fee">

                    Total Fee:
                    ₹${booking.fee}

                </div>


                <button
                    class="cancel-button"
                    id="cancelBookingButton"
                    onclick="cancelBooking()"
                >
                    Cancel Booking
                </button>

            </div>

        `;

    }


    function cancelBooking() {

        const confirmCancel =
            confirm(
                "Are you sure you want to cancel this booking?"
            );


        if (confirmCancel) {

            localStorage.removeItem("booking");

            localStorage.removeItem("selectedSlot");


            alert(
                "Booking cancelled successfully."
            );


            displayBooking();

        }

    }


    displayBooking();


</script>


</body>

</html>
