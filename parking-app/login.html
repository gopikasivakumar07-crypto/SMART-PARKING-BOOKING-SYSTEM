<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Parking</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #1e3a5f;
            color: white;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .login-box h1 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2e86de;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2e86de;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e6fbd;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #2e86de;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        🚗 Smart Parking
    </div>

    <a href="index.html">Home</a>

</header>


<div class="container">

    <div class="login-box">

        <h1>Login</h1>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">Email</label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                >

            </div>


            <div class="form-group">

                <label for="password">Password</label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                >

            </div>


            <button type="submit" id="loginButton">
                Login
            </button>

            <div class="message" id="loginMessage"></div>

        </form>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>

    </div>

</div>


<script>

    document.getElementById("loginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const message = document.getElementById("loginMessage");

        if (email === "user@gmail.com" && password === "password123") {

            message.style.color = "green";
            message.textContent = "Login successful!";

            setTimeout(function() {
                window.location.href = "dashboard.html";
            }, 1000);

        } else {

            message.style.color = "red";
            message.textContent = "Invalid email or password.";

        }

    });

</script>

</body>
</html>
